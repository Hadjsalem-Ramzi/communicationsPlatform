version: '3.8'

services:
  backend:
    image: ${DOCKER_HUB_USER}/spring-app:${TAG:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: demo-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILE:-prod}
    networks:
      - demo-network
    restart: unless-stopped

  frontend:
    image: ${DOCKER_HUB_USER}/angular-app:${TAG:-latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: demo-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - demo-network
    restart: unless-stopped

networks:
  demo-network:
    driver: bridge