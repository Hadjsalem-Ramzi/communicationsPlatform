<div class="card">
  <div class="card-header">
    <h5 class="card-title">Registration Form</h5>
  </div>
  <div class="card-body">
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="mb-3">
        <label for="firstname" class="form-label">First Name</label>
        <input type="text" id="firstname" class="form-control" formControlName="firstname" />
        <div class="form-text text-danger" *ngIf="isSubmitted && formControls['firstname']?.errors?.['required']">
          First Name is required
        </div>
      </div>

      <div class="mb-3">
        <label for="lastname" class="form-label">Last Name</label>
        <input type="text" id="lastname" class="form-control" formControlName="lastname" />
        <div class="form-text text-danger" *ngIf="isSubmitted && formControls['lastname']?.errors?.['required']">
          Last Name is required
        </div>
      </div>

      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="email" id="email" class="form-control" formControlName="email" />
        <div class="form-text text-danger" *ngIf="isSubmitted && formControls['email']?.errors?.['required']">
          Email is required
        </div>
        <div class="form-text text-danger" *ngIf="isSubmitted && formControls['email']?.errors?.['email']">
          Invalid email format
        </div>
      </div>

      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input type="password" id="password" class="form-control" formControlName="password" />
        <div class="form-text text-danger" *ngIf="isSubmitted && formControls['password']?.errors?.['required']">
          Password is required
        </div>
        <div class="form-text text-danger" *ngIf="isSubmitted && formControls['password']?.errors?.['minlength']">
          Password must be at least 6 characters
        </div>
      </div>

      <div class="mb-3">
        <label for="role" class="form-label">Role</label>
        <input type="text" id="role" class="form-control" formControlName="role" />
        <div class="form-text text-danger" *ngIf="isSubmitted && formControls['role']?.errors?.['required']">
          Role is required
        </div>
      </div>

      <div *ngIf="errorMessage" class="alert alert-danger" role="alert">
        {{ errorMessage }}
      </div>

      <button type="submit" class="btn btn-primary">Register</button>
    </form>
  </div>
</div>
