<div class="container mt-5" *ngIf="!showRegisterForm">
  <div class="card">
    <div class="card-header">
      <h2>Login</h2>
    </div>
    <div class="card-body">
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <div class="mb-3">
          <label for="email" class="form-label">Email:</label>
          <input type="text" id="email" formControlName="email" class="form-control" />
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Password:</label>
          <input type="password" id="password" formControlName="password" class="form-control" />
        </div>
        <button type="submit" class="btn btn-primary">Login</button>
        <button type="button" class="btn btn-link" (click)="toggleForm()">Register</button>
      </form>
      <div *ngIf="errorMessage" class="alert alert-danger mt-3">{{ errorMessage }}</div>
      <div *ngIf="successMessage" class="alert alert-success mt-3">{{ successMessage }}</div> <!-- Alerte de succès -->
    </div>
  </div>
</div>

<!-- Formulaire d'inscription -->
<div class="container mt-5" *ngIf="showRegisterForm">
  <div class="card">
    <div class="card-header">
      <h2>Register</h2>
    </div>
    <div class="card-body">
      <app-register (registerSuccess)="onRegisterSuccess()"></app-register> <!-- Écoute de l'événement -->
      <button type="button" class="btn btn-link mt-3" (click)="toggleForm()">Back to Login</button>
    </div>
  </div>
</div>
